services:
  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-aggregator-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=TransactionAggregatorDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-CapitecSystemPassword123!};TrustServerCertificate=True;
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Jwt__SecretKey: ${JWT_SECRET_KEY:-RNTIEJJF573J7VM22058MGMBGJD88383GMMFMK39599N}
      Jwt__Issuer: TransactionAggregator
      Jwt__Audience: TransactionAggregatorClient
      FileSource__ImportDirectory: /app/data/imports
      IngestionJob__Enabled: "true"
      IngestionJob__IntervalSeconds: "300"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs
      # Bind-mount so sample CSV from the repo is visible inside the container
      - ./data/imports:/app/data/imports:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── SQL Server ────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: transaction-aggregator-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CapitecSystemPassword123!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: transaction-aggregator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver-data:
  redis-data:
  api-logs:

networks:
  backend:
    driver: bridge
